name: Gates

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: gates-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run fmt:check
      - run: pnpm run build --force
      - run: pnpm run typecheck --force
      - run: pnpm run typecheck:tsc --force
      - run: pnpm run typecheck:parity
      - run: pnpm knip
      - run: pnpm run lint
      - run: pnpm run test:scripts
      - run: pnpm run test:run --force
      - run: pnpm -C packages/core exec playwright install --with-deps chromium
      - run: pnpm -C packages/core run test:dist
      - run: pnpm run build:story --force
