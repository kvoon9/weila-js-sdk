name: Preview Release

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: preview-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec turbo run build --force --filter=@vois/weila-sdk-core --filter=@vois/weila-sdk-ui
      - run: pnpm exec pkg-pr-new publish --pnpm --previewVersion --packageManager=pnpm ./packages/core ./packages/ui
